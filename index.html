<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <link rel="stylesheet" href="assets/css/main.css">
  </head>
  <body>
    <!-- Splash Screen -->
    <div id="splash-screen">
      <div class="particles" id="particles"></div>
      <div class="ar-icon">
        <svg viewBox="0 0 24 24" fill="white">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
      </div>
      <div class="logo-container">
         <img src="assets/images/diwaspark_transparent.png" onerror="this.style.display='none'" />
        <div class="logo-subtitle">AUGMENTED REALITY</div>
      </div>
      <div class="loading-container">
        <div class="loading-text">Loading Experience...</div>
        <div class="loading-bar"><div class="loading-progress"></div></div>
      </div>
    </div>

    <!-- Fullscreen Prompt -->
    <div id="fullscreen-prompt" class="hidden">
      <div class="particles" id="particles1"></div>
      <div class="fullscreen-icon">
        <svg viewBox="0 0 24 24" fill="white">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
      </div>
      <div class="fullscreen-title">Ready for <img src="assets/images/AR.png" alt="AR" onerror="this.style.display='none'" > Experience</div>
      <div class="fullscreen-subtitle">Tap the button below to enter fullscreen mode for the best augmented reality experience</div>
      <button class="fullscreen-button" id="enter-fullscreen-btn" disabled="true">ENTER FULLSCREEN</button>
    </div>

    <!-- Reminder -->
    <div class="reminder-overlay" id="reminder">
      <div class="reminders">
        <p>Please switch your screen to landscape mode.</p>
      </div>
    </div>

   <script src="assets/js/app.js"></script>
  </body>
</html>
