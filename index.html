<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="assets/js/rotation.js"></script>
    <script src="assets/js/smooth-position.js"></script>
    <link rel="stylesheet" href="assets/css/main.css">
  </head>
  <body>
    <!-- Splash Screen -->
    <div id="splash-screen">
      <div class="particles" id="particles"></div>
      <div class="ar-icon">
        <!-- <img src="assets/images/diwaspark_logo.png" onerror="this.style.display='none'" /> -->
        <svg viewBox="0 0 24 24" fill="white">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
      </div>
      <div class="logo-container">
         <img src="assets/images/diwaspark_transparent.png" onerror="this.style.display='none'" />
        <div class="logo-subtitle">AUGMENTED REALITY</div>
      </div>
      <div class="loading-container">
        <div class="loading-text">Loading Experience...</div>
        <div class="loading-bar"><div class="loading-progress"></div></div>
      </div>
    </div>

    <!-- Fullscreen Prompt -->
    <div id="fullscreen-prompt" class="hidden">
      <div class="particles" id="particles1"></div>
      <div class="fullscreen-icon">
        <svg viewBox="0 0 24 24" fill="white">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
      </div>
      <div class="fullscreen-title">Ready for <img src="assets/images/AR.png" alt="AR" onerror="this.style.display='none'" > Experience</div>
      <div class="fullscreen-subtitle">Tap the button below to enter fullscreen mode for the best augmented reality experience</div>
      <button class="fullscreen-button" id="enter-fullscreen-btn">ENTER FULLSCREEN</button>
    </div>

    <!-- logo on the scene -->
    <div class="ar-logo">
      <img src="assets/images/diwaspark_transparent.png"/>
    </div>

    <!-- Scanning Overlay -->
    <div id="scanning-overlay" class="hidden">
        <div class="inner">
	        <img src="assets/images/SEM_logo.png"/>
	      <div class="scanline"></div>
      </div>
    </div>

    <!-- Zoom Controls -->
    <div id="zoom-controls">
      <button id="zoom-in">+</button>
      <button id="zoom-out">-</button>
    </div>

    <!-- AR Scene -->
    <a-scene mindar-image="imageTargetSrc: ./BB-IISSUE1-25-26.mind; uiError:no; uiScanning: #scanning-overlay; filterMinCF:0.001; filterBeta: 0.01; warmupTolerance: 1; missTolerance: 1" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights, antialias: true, alpha: true" vr-mode-ui="enabled: false" xr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: true">
      <a-assets>
        <a-asset-item id="EGGModel" src="./assets/3D/eggv2.glb"></a-asset-item>
        <a-asset-item id="WaterModel" src="./assets/3D/waterv2.glb"></a-asset-item>
        <a-asset-item id="intestineModel" src="./assets/3D/intestinev2.glb"></a-asset-item>
        <a-asset-item id="ExtremophilesModel" src="./assets/3D/Extremophilesv2.glb"></a-asset-item>
        <a-asset-item id="HeartModel" src="./assets/3D/Heartv2.glb"></a-asset-item>
        <a-asset-item id="MamothModel" src="./assets/3D/Mamothv2.glb"></a-asset-item>
        <a-asset-item id="seismometerModel" src="./assets/3D/seismometerv2.glb"></a-asset-item>
        <a-asset-item id="everestModel" src="./assets/3D/everestv2.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0: The Egg -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model rotation="0 0 0" position="-0.6 0 0.1" scale="0.45 0.45 0.45" src="#EGGModel" touch-rotate ></a-gltf-model>
        <a-plane position="0.6 0 0" width="1.1" height="0.7" color="#ffffff" opacity="0.95" material="shader: flat">
          <a-text value="An Egg-cellent Source of Nutrition" 
                  color="#667eea" 
                  align="center" 
                  width="1" 
                  position="0 0.25 0.01"
                  wrap-count="28"></a-text>
          <a-text value="Chicken eggs are highly nutritious. They are rich in protein, fat, and essential vitamins, such as A, D, and E. Experts recommend eating one to two chicken eggs a day." 
                  color="#333333" 
                  align="center" 
                  width="1" 
                  position="0 -0.08 0.01"
                  wrap-count="32"></a-text>
        </a-plane>
      </a-entity>

      <!-- Target 1: Water -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model rotation="0 0 0" position="-0.6 0 0.1" scale="0.45 0.45 0.45" src="#WaterModel" touch-rotate ></a-gltf-model>
        <a-plane position="0.6 0 0" width="1.1" height="0.7" color="#ffffff" opacity="0.95" material="shader: flat">
          <a-text value="How a Hand Pump Draws Water" 
                  color="#667eea" 
                  align="center" 
                  width="1" 
                  position="0 0.25 0.01"
                  wrap-count="28"></a-text>
          <a-text value="A hand pump is an ancient technology used to lift water. Its mechanism involves creating a vacuum, which then draws water up from the ground." 
                  color="#333333" 
                  align="center" 
                  width="1" 
                  position="0 -0.08 0.01"
                  wrap-count="32"></a-text>
        </a-plane>
      </a-entity>

      <!-- Target 2: Digestive System -->
      <a-entity mindar-image-target="targetIndex: 2">
        <a-gltf-model rotation="0 0 0" position="-0.6 0 0.1" scale="0.45 0.45 0.45" src="#intestineModel" touch-rotate ></a-gltf-model>
        <a-plane position="0.6 0 0" width="1.1" height="0.7" color="#ffffff" opacity="0.95" material="shader: flat">
          <a-text value="Small Intestine versus Large Intestine" 
                  color="#667eea" 
                  align="center" 
                  width="1" 
                  position="0 0.25 0.01"
                  wrap-count="28"></a-text>
          <a-text value="The human intestine is divided into two sections: the small intestine and the large intestine. The small intestine primarily absorbs nutrients from digested food, while the large intestine mainly absorbs electrolytes and water." 
                  color="#333333" 
                  align="center" 
                  width="1" 
                  position="0 -0.08 0.01"
                  wrap-count="32"></a-text>
        </a-plane>
      </a-entity>

      <!-- Target 3: Extremophiles -->
      <a-entity mindar-image-target="targetIndex: 3">
        <a-gltf-model rotation="0 0 0" position="-0.6 0 0.1" scale="0.45 0.45 0.45" src="#ExtremophilesModel" touch-rotate ></a-gltf-model>
        <a-plane position="0.6 0 0" width="1.1" height="0.7" color="#ffffff" opacity="0.95" material="shader: flat">
          <a-text value="Life's Extremophiles" 
                  color="#667eea" 
                  align="center" 
                  width="1" 
                  position="0 0.25 0.01"
                  wrap-count="28"></a-text>
          <a-text value="Archaeans are unicellular and prokaryotic organisms, just like bacteria. However, unlike bacteria, archaeans can tolerate extreme environmental conditions, and their cell walls are composed of polysaccharides." 
                  color="#333333" 
                  align="center" 
                  width="1" 
                  position="0 -0.08 0.01"
                  wrap-count="32"></a-text>
        </a-plane>
      </a-entity>

      <!-- Target 4: Heart -->
      <a-entity mindar-image-target="targetIndex: 4">
        <a-gltf-model rotation="0 0 0" position="-0.6 0 0.1" scale="0.45 0.45 0.45" src="#HeartModel" touch-rotate ></a-gltf-model>
        <a-plane position="0.6 0 0" width="1.1" height="0.7" color="#ffffff" opacity="0.95" material="shader: flat">
          <a-text value="The Amazing Human Heart" 
                  color="#667eea" 
                  align="center" 
                  width="1" 
                  position="0 0.25 0.01"
                  wrap-count="28"></a-text>
          <a-text value="The human heart is a remarkable organ. Its main function is to pump blood throughout the body. On the average, it beats more than 100 000 times a day. Amazing, isn't it?" 
                  color="#333333" 
                  align="center" 
                  width="1" 
                  position="0 -0.08 0.01"
                  wrap-count="32"></a-text>
        </a-plane>
      </a-entity>

      <!-- Target 5: Mammoth -->
      <a-entity mindar-image-target="targetIndex: 5">
        <a-gltf-model rotation="0 0 0" position="-0.6 0 0.1" scale="0.45 0.45 0.45" src="#MamothModel" touch-rotate ></a-gltf-model>
        <a-plane position="0.6 0 0" width="1.1" height="0.7" color="#ffffff" opacity="0.95" material="shader: flat">
          <a-text value="Woolly Mammoths' Ice Age Home" 
                  color="#667eea" 
                  align="center" 
                  width="1" 
                  position="0 0.25 0.01"
                  wrap-count="28"></a-text>
          <a-text value="Woolly mammoths were herbivores that lived in steppe tundras. These ecosystems were cold, dry regions covered with low shrubs, sedges, and grasses." 
                  color="#333333" 
                  align="center" 
                  width="1" 
                  position="0 -0.08 0.01"
                  wrap-count="32"></a-text>
        </a-plane>
      </a-entity>

      <!-- Target 6: Seismometer -->
      <a-entity mindar-image-target="targetIndex: 6">
        <a-gltf-model rotation="0 0 0" position="-0.6 0 0.1" scale="0.45 0.45 0.45" src="#seismometerModel" touch-rotate ></a-gltf-model>
        <a-plane position="0.6 0 0" width="1.1" height="0.7" color="#ffffff" opacity="0.95" material="shader: flat">
          <a-text value="Sensitive Seismometer" 
                  color="#667eea" 
                  align="center" 
                  width="1" 
                  position="0 0.25 0.01"
                  wrap-count="28"></a-text>
          <a-text value="A seismometer is a tool scientists use to detect and measure seismic waves. Extremely sensitive to ground movements, it can detect shifts as small as one ten-millionth of a centimeter!" 
                  color="#333333" 
                  align="center" 
                  width="1" 
                  position="0 -0.08 0.01"
                  wrap-count="32"></a-text>
        </a-plane>
      </a-entity>

      <!-- Target 7: Mount Everest -->
      <a-entity mindar-image-target="targetIndex: 7">
        <a-gltf-model rotation="0 0 0" position="-0.6 0 0.1" scale="0.45 0.45 0.45" src="#everestModel" touch-rotate ></a-gltf-model>
        <a-plane position="0.6 0 0" width="1.1" height="0.7" color="#ffffff" opacity="0.95" material="shader: flat">
          <a-text value="Mount Everest: The Growing Giant" 
                  color="#667eea" 
                  align="center" 
                  width="1" 
                  position="0 0.25 0.01"
                  wrap-count="28"></a-text>
          <a-text value="Mount Everest, the world's highest mountain, was formed due to the convergent plate boundary between the Indian and Eurasian tectonic plates. Scientists say that Mount Everest continues to grow even today." 
                  color="#333333" 
                  align="center" 
                  width="1" 
                  position="0 -0.08 0.01"
                  wrap-count="32"></a-text>
        </a-plane>
      </a-entity>
    </a-scene>

   <script src="assets/js/app.js"></script>
   <script src="assets/js/zoom.js"></script>
  </body>
</html>
